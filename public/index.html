<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AR Shoot - Collect 'Em All!</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container" id="main-menu">
        <h1>AR Shoot</h1>
        <p style="margin-bottom: 1.5rem; color: #666;">Collect 10 icons in 120 seconds!</p>

        <input type="text" id="playerName" placeholder="Enter Your Name" maxlength="15">

        <button id="start-btn">START GAME</button>
        <button id="leaderboard-btn" class="leaderboard-btn">LEADERBOARD</button>
    </div>

    <!-- How to Play Popup -->
    <div class="overlay" id="how-to-play-overlay"></div>
    <div class="popup" id="how-to-play-popup">
        <h2>How to Play</h2>
        <p style="margin: 1.5rem 0; line-height: 1.6;">
            1. Move your phone to aim at the icons.<br>
            2. Tap on an icon to collect it.<br>
            3. Collect all 10 icons as fast as you can!<br>
            4. You have 120 seconds.
        </p>
        <button id="close-how-to-btn">LET'S GO!</button>
    </div>

    <script>
        const startBtn = document.getElementById('start-btn');
        const leaderboardBtn = document.getElementById('leaderboard-btn');
        const playerNameInput = document.getElementById('playerName');
        const htpOverlay = document.getElementById('how-to-play-overlay');
        const htpPopup = document.getElementById('how-to-play-popup');
        const closeHtpBtn = document.getElementById('close-how-to-btn');

        startBtn.onclick = () => {
            const name = playerNameInput.value.trim();
            if (!name) {
                alert('Please enter your name!');
                return;
            }
            localStorage.setItem('ar_shoot_player', name);

            // Show HTP Popup
            htpOverlay.style.display = 'block';
            htpPopup.style.display = 'block';
        };

        closeHtpBtn.onclick = () => {
            window.location.href = 'game.html';
        };

        leaderboardBtn.onclick = () => {
            window.location.href = 'leaderboard.html';
        };
    </script>
</body>

</html>
