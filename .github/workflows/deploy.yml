name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "staging" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Build Docker Image
      run: |
        docker build -t ar-shoot-app:latest .

    - name: Run Basic Health Check (Optional)
      run: |
        # In a real CI, you'd run 'npm test' or equivalent here
        echo "Build successful!"

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3

    - name: Deploy to Production
      env:
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        REMOTE_HOST: ${{ secrets.REMOTE_HOST }}
        REMOTE_USER: ${{ secrets.REMOTE_USER }}
      run: |
        echo "Starting deployment to $REMOTE_HOST..."
        # This is a placeholder for actual deployment logic (e.g., SSH + docker-compose pull/up)
        # To enable this, you would:
        # 1. Set up SSH keys
        # 2. Run: ssh -o StrictHostKeyChecking=no $REMOTE_USER@$REMOTE_HOST "cd ar-shoot && git pull && docker-compose up --build -d"
        echo "Deployment triggered successfully!"
